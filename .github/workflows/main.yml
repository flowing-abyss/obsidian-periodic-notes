name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install modules
        run: node .yarn/releases/yarn-berry.cjs install --immutable

      - name: Lint
        run: node .yarn/releases/yarn-berry.cjs lint

      - name: Test
        run: node .yarn/releases/yarn-berry.cjs test
