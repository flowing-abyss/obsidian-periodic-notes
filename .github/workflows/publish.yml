name: Build plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check release version
        run: |
          node - <<'NODE'
          const version = process.env.GITHUB_REF_NAME;
          for (const path of ["package.json", "manifest.json"]) {
            if (require(`./${path}`).version !== version) {
              throw new Error(`${path} version does not match tag ${version}`);
            }
          }
          NODE
          test -s ".github/release-notes/$GITHUB_REF_NAME.md"

      - name: Install modules
        run: node .yarn/releases/yarn-berry.cjs install --immutable

      - name: Test
        run: node .yarn/releases/yarn-berry.cjs test

      - name: Build
        run: node .yarn/releases/yarn-berry.cjs build

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
            main.js manifest.json styles.css
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
